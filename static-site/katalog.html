<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk — Nirmala Apparel & Batik</title>
  <meta name="description" content="Katalog baju online lengkap. Filter instan dan pesan langsung via WhatsApp.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #d6d3d1;
      background: white;
      font-size: 13px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: #1c1917;
      color: white;
      border-color: #1c1917;
    }
    .search-input {
      width: 100%;
      max-width: 340px;
      padding: 10px 14px;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    /* Modal Detail */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }
    .modal-content {
      background: white;
      max-width: 600px;
      width: 100%;
      border-radius: 16px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .chip-btn {
      padding: 6px 12px;
      border: 1px solid #d6d3d1;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    .chip-btn.active {
      background: #1c1917;
      color: white;
      border-color: #1c1917;
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-container">
      <a href="index.html" class="brand">Nirmala Apparel</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Beranda</a></li>
          <li><a href="katalog.html" class="active">Katalog</a></li>
          <li><a href="tentang.html">Tentang</a></li>
          <li><a href="kontak.html">Kontak</a></li>
        </ul>
      </nav>
      <a href="keranjang.html" class="cart-icon-btn">
        Keranjang <span class="cart-badge">0</span>
      </a>
    </div>
  </header>

  <main class="container" style="padding-top: 30px; padding-bottom: 60px;">
    <h1 style="font-family: 'Playfair Display', serif; font-size: 28px; color: #1c1917; margin-bottom: 8px;">
      Katalog Busana Lengkap
    </h1>
    <p style="color: #78716c; font-size: 14px; margin-bottom: 24px;">
      Filter sesuai selera Anda, lalu klik produk untuk melihat varian dan pesan via WhatsApp.
    </p>

    <!-- Search & Filter Controls -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Cari nama model atau warna...">
      <div class="filter-bar" id="category-filters">
        <button class="filter-btn active" data-cat="Semua">Semua</button>
        <button class="filter-btn" data-cat="Atasan">Atasan</button>
        <button class="filter-btn" data-cat="Dress">Dress</button>
        <button class="filter-btn" data-cat="Batik">Batik</button>
        <button class="filter-btn" data-cat="Bawahan">Bawahan</button>
      </div>
    </div>

    <!-- Products Grid -->
    <div id="catalog-grid" class="product-grid">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <!-- Modal Detail Produk -->
  <div id="product-modal" class="modal-overlay">
    <div class="modal-content">
      <button onclick="closeModal()" style="position: absolute; right: 16px; top: 16px; background: none; border: none; font-size: 20px; cursor: pointer;">✕</button>
      <div id="modal-body">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <a href="https://wa.me/62882021480385?text=Halo%20Admin%20Nirmala%2C%20mau%20tanya%20produk" target="_blank" class="floating-wa" title="Chat WhatsApp">
    💬
  </a>

  <script src="app.js"></script>
  <script>
    let allProducts = [];
    let selectedCat = 'Semua';
    let searchQuery = '';
    let currentSelectedProduct = null;
    let selectedUkuran = '';
    let selectedWarna = '';

    fetch('products.json')
      .then(res => res.json())
      .then(data => {
        allProducts = data;
        renderCatalog();
      });

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      const filtered = allProducts.filter(p => {
        const matchCat = selectedCat === 'Semua' || p.kategori === selectedCat;
        const matchSearch = p.nama.toLowerCase().includes(searchQuery.toLowerCase()) ||
                            p.deskripsi.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #78716c; padding: 40px 0;">Tidak ada produk yang cocok dengan pencarian Anda.</p>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="product-card" onclick="openProductDetail('${p.id}')" style="cursor: pointer;">
          <img src="${p.foto[0]}" alt="${p.nama}" class="product-thumb">
          <div class="product-info">
            <div>
              <p style="font-size: 11px; text-transform: uppercase; color: #78716c; font-weight: 600;">${p.kategori} · Stok ${p.stok}</p>
              <h3 class="product-name">${p.nama}</h3>
            </div>
            <div style="margin-top: 8px; display: flex; justify-content: space-between; align-items: center;">
              <span class="product-price">${formatRupiah(p.harga)}</span>
              <span style="font-size: 12px; color: #92400e; font-weight: 600;">Lihat Detail &rarr;</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Category button click
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCat = btn.getAttribute('data-cat');
        renderCatalog();
      });
    });

    // Search input
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderCatalog();
    });

    // Modal
    function openProductDetail(id) {
      const prod = allProducts.find(p => p.id === id);
      if (!prod) return;
      currentSelectedProduct = prod;
      selectedUkuran = prod.ukuran[0];
      selectedWarna = prod.warna[0];

      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = `
        <div style="display: flex; gap: 16px; flex-wrap: wrap;">
          <img src="${prod.foto[0]}" style="width: 100%; max-width: 220px; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px;">
          <div style="flex: 1; min-width: 240px;">
            <p style="font-size: 12px; color: #78716c; text-transform: uppercase;">${prod.kategori}</p>
            <h2 style="font-size: 20px; margin: 4px 0 8px; font-family: 'Playfair Display', serif;">${prod.nama}</h2>
            <p style="font-size: 18px; font-weight: bold; color: #1c1917; margin-bottom: 12px;">${formatRupiah(prod.harga)}</p>
            <p style="font-size: 13px; color: #57534e; margin-bottom: 16px;">${prod.deskripsi}</p>
            
            <div style="margin-bottom: 12px;">
              <p style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">Pilih Ukuran:</p>
              ${prod.ukuran.map(u => `<button class="chip-btn ${u === selectedUkuran ? 'active' : ''}" onclick="setUkuran('${u}', this)">${u}</button>`).join('')}
            </div>

            <div style="margin-bottom: 16px;">
              <p style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">Pilih Warna:</p>
              ${prod.warna.map(w => `<button class="chip-btn ${w === selectedWarna ? 'active' : ''}" onclick="setWarna('${w}', this)">${w}</button>`).join('')}
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
              <button onclick="handleModalBuyWA()" class="btn btn-wa" style="width: 100%; padding: 12px;">Pesan Langsung via WhatsApp</button>
              <button onclick="handleModalAddCart()" class="btn btn-primary" style="width: 100%; padding: 12px; background: #e7e5e4; color: #1c1917;">Tambah ke Keranjang</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('product-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('product-modal').style.display = 'none';
    }

    function setUkuran(u, el) {
      selectedUkuran = u;
      el.parentElement.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function setWarna(w, el) {
      selectedWarna = w;
      el.parentElement.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function handleModalBuyWA() {
      if (!currentSelectedProduct) return;
      orderProductViaWA(currentSelectedProduct.nama, selectedUkuran, selectedWarna, currentSelectedProduct.harga);
    }

    function handleModalAddCart() {
      if (!currentSelectedProduct) return;
      addToCart(currentSelectedProduct, selectedUkuran, selectedWarna, 1);
      closeModal();
    }
  </script>
</body>
</html>
