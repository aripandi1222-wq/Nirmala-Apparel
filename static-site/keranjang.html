<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja — Nirmala Apparel & Batik</title>
  <meta name="description" content="Keranjang belanja dan checkout WhatsApp otomatis tanpa payment gateway.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    .cart-table th, .cart-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e7e5e4;
      font-size: 13px;
    }
    .cart-table th {
      background: #f5f3ef;
      font-weight: 600;
    }
    .qty-btn {
      width: 26px;
      height: 26px;
      border: 1px solid #d6d3d1;
      background: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    .checkout-form {
      background: #f5f3ef;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e7e5e4;
      margin-top: 24px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d6d3d1;
      border-radius: 6px;
      font-size: 13px;
      background: white;
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-container">
      <a href="index.html" class="brand">Nirmala Apparel</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Beranda</a></li>
          <li><a href="katalog.html">Katalog</a></li>
          <li><a href="tentang.html">Tentang</a></li>
          <li><a href="kontak.html">Kontak</a></li>
        </ul>
      </nav>
      <a href="keranjang.html" class="cart-icon-btn active">
        Keranjang <span class="cart-badge">0</span>
      </a>
    </div>
  </header>

  <main class="container" style="padding-top: 30px; padding-bottom: 60px;">
    <h1 style="font-family: 'Playfair Display', serif; font-size: 28px; color: #1c1917; margin-bottom: 8px;">
      Keranjang Belanja Anda
    </h1>
    <p style="color: #78716c; font-size: 14px;">
      Periksa kembali pesanan Anda sebelum checkout langsung ke WhatsApp admin toko.
    </p>

    <div id="cart-content">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    function renderCartPage() {
      const cart = getCart();
      const container = document.getElementById('cart-content');

      if (cart.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 60px 0;">
            <p style="font-size: 16px; color: #78716c; margin-bottom: 16px;">Keranjang belanja Anda masih kosong.</p>
            <a href="katalog.html" class="btn btn-primary">Lihat Katalog Produk &rarr;</a>
          </div>
        `;
        return;
      }

      let subtotal = 0;
      const rows = cart.map((item, index) => {
        const itemTotal = item.harga * item.qty;
        subtotal += itemTotal;
        return `
          <tr>
            <td>
              <strong>${item.nama}</strong><br>
              <small style="color: #78716c;">Varian: ${item.ukuran} | ${item.warna}</small>
            </td>
            <td>${formatRupiah(item.harga)}</td>
            <td>
              <button class="qty-btn" onclick="changeQty('${item.cartId}', -1)">-</button>
              <span style="display: inline-block; width: 24px; text-align: center; font-weight: 600;">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty('${item.cartId}', 1)">+</button>
            </td>
            <td><strong>${formatRupiah(itemTotal)}</strong></td>
            <td>
              <button onclick="deleteItem('${item.cartId}')" style="background: none; border: none; color: #dc2626; cursor: pointer; font-size: 12px;">Hapus</button>
            </td>
          </tr>
        `;
      }).join('');

      container.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>Produk</th>
              <th>Harga</th>
              <th>Qty</th>
              <th>Subtotal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
          <button onclick="emptyCart()" style="background: none; border: 1px solid #d6d3d1; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">Kosongkan Keranjang</button>
          <div style="font-size: 18px; font-weight: bold; color: #1c1917;">
            Total Belanja: <span style="color: #92400e;">${formatRupiah(subtotal)}</span>
          </div>
        </div>

        <!-- Form Pemesan -->
        <div class="checkout-form">
          <h3 style="font-size: 16px; margin-bottom: 12px; color: #1c1917;">Data Pemesan (Untuk Pesan WhatsApp Otomatis)</h3>
          <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="cust-nama" placeholder="Contoh: Siti Rahmawati">
          </div>
          <div class="form-group">
            <label>No. WhatsApp</label>
            <input type="tel" id="cust-phone" placeholder="Contoh: 0812xxxxxxxx">
          </div>
          <div class="form-group">
            <label>Kota / Kecamatan</label>
            <input type="text" id="cust-kota" placeholder="Contoh: Bandung, Coblong">
          </div>
          <div class="form-group">
            <label>Alamat Pengiriman</label>
            <textarea id="cust-alamat" rows="2" placeholder="Jl. Merdeka No. 12 RT 02 RW 05"></textarea>
          </div>
          <div class="form-group">
            <label>Pilihan Pembayaran Manual</label>
            <select id="cust-pay">
              <option value="Transfer Bank BCA / Mandiri">Transfer Bank (BCA / Mandiri / BRI)</option>
              <option value="COD (Bayar di Tempat via Kurir)">COD (Bayar di Tempat via Kurir)</option>
              <option value="QRIS Manual">QRIS Manual</option>
            </select>
          </div>

          <button onclick="handleCheckout()" class="btn btn-wa" style="width: 100%; padding: 14px; font-size: 15px; margin-top: 12px;">
            💬 Checkout Sekarang via WhatsApp (${formatRupiah(subtotal)})
          </button>
          <p style="font-size: 11px; text-align: center; color: #78716c; margin-top: 8px;">
            Admin toko akan membalas total ongkos kirim dan nomor rekening pembayaran resmi via chat WhatsApp.
          </p>
        </div>
      `;
    }

    function changeQty(cartId, delta) {
      let cart = getCart();
      const item = cart.find(i => i.cartId === cartId);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.cartId !== cartId);
        }
        saveCart(cart);
        renderCartPage();
      }
    }

    function deleteItem(cartId) {
      let cart = getCart().filter(i => i.cartId !== cartId);
      saveCart(cart);
      renderCartPage();
    }

    function emptyCart() {
      if (confirm('Kosongkan semua barang dari keranjang belanja?')) {
        saveCart([]);
        renderCartPage();
      }
    }

    function handleCheckout() {
      const customer = {
        nama: document.getElementById('cust-nama').value,
        telepon: document.getElementById('cust-phone').value,
        kota: document.getElementById('cust-kota').value,
        alamat: document.getElementById('cust-alamat').value,
        pembayaran: document.getElementById('cust-pay').value,
      };

      checkoutCartViaWA(customer);
    }

    document.addEventListener('DOMContentLoaded', renderCartPage);
  </script>
</body>
</html>
